on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  auto-fix:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'claude/fix-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/fix-ci RUN_ID: ${{ github.event.workflow_run.id }}"
          claude_args: |
            --max-turns 25
            --allowedTools "Read,Edit,Glob,Grep,Bash(npm test:*),Bash(gh run view:*),Bash(gh pr list:*),Bash(git status:*),Bash(git diff:*),Bash(git checkout -b claude/fix-*),Bash(git add:*),Bash(git commit:*),Bash(git push origin claude/fix-*),Bash(git push -u origin claude/fix-*),Bash(gh pr create:*)"
